# Scotheim's places to explore, for Expand World Data. Each prefab is a blueprint Scotheim writes to
# BepInEx/config/PlanBuild (EWD's default "Blueprint folder"); the sources are in src/Scotheim/Data.
# Edit freely: Scotheim only replaces this file while it's unedited. Once edited, new defaults go to a .new file beside it.
# Locations are placed when a world is generated: use a new world, or EWD's `genloc` for unexplored areas.

# Brochs: Iron Age drystone towers, here ruined and held by redcaps.
- prefab: scotheim_broch
  biome: highland_moor, caledonian_forest
  quantity: 8
  minAltitude: 3
  maxAltitude: 45
  maxTerrainDelta: 3
  randomRotation: true
  prioritized: true
  exteriorRadius: 10
  clearArea: true
  levelArea: true
  discoverLabel: Broch
  groups: scotheim_place
  awayFrom:
  - scotheim_place, 400
# Crannogs: round houses on timber piles in lochs.
- prefab: scotheim_crannog
  biome: highland_moor, caledonian_forest
  quantity: 8
  minAltitude: -6
  maxAltitude: -1
  maxTerrainDelta: 4
  snapToWater: true
  randomRotation: true
  prioritized: true
  exteriorRadius: 8
  levelArea: false
  discoverLabel: Crannog
  groups: scotheim_place
  awayFrom:
  - scotheim_place, 300
