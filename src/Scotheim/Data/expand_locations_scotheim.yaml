# Summit cairns: Munro bagging. How many fit depends on the terrain (16, 24 and 10 in the first three test
# worlds), so Compleatist needs 12 or every cairn the world has, whichever is fewer (the server counts them).
# A cairn needs only ~3 m of ground, so steep tops are allowed (EWD levels the small site). Not prioritized:
# when fewer fit than asked for, EWD gives up after half the attempts, which saves world generation time.
- prefab: scotheim_cairn
  biome: munros
  quantity: 24
  minAltitude: 65
  maxTerrainDelta: 12
  randomRotation: true
  exteriorRadius: 3
  clearArea: true
  discoverLabel: Summit cairn
  groups: scotheim_cairn
  awayFrom:
  - scotheim_cairn, 200
