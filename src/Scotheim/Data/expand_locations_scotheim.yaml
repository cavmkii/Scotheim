# Summit cairns: Munro bagging. Scotheim puts one on top of each Munro itself (it knows where the terrain's domes
# are), so EWD places none at random: quantity 0. The entry has to stay, because it's what makes scotheim_cairn
# a location Scotheim can register. Compleatist needs 12, or every cairn the world has if that's fewer.
- prefab: scotheim_cairn
  biome: munros
  quantity: 0
  minAltitude: 65
  maxTerrainDelta: 12
  randomRotation: true
  exteriorRadius: 3
  clearArea: true
  discoverLabel: Summit cairn
  groups: scotheim_cairn
  awayFrom:
  - scotheim_cairn, 200
# Symbol stone 6, "The eagle", marks the Grey Man's stone on the map when read.
- prefab: scotheim_runestone6
  biome: highland_moor, caledonian_forest, munros
