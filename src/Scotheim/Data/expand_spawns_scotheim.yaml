# Scotheim creature spawns for Expand World Data (needs "Spawn data = true" in expand_world_data.cfg).
# The Scot_* prefabs are Jötunn clones registered by Scotheim.dll (see src/Scotheim/Content).
# fields.damage replaces vanilla's random 0.75-1 damage factor, so 2 is roughly 2.3x vanilla.
# Health and drops are set on the clones, not here.
# Edit freely: Scotheim only replaces this file while it's unedited. Once edited, new defaults go to a .new file beside it.

# ---------------------------------------------------------------- Highland Moor
- prefab: Scot_Sheep
  name: Scotheim sheep
  biome: highland_moor
  spawnChance: 60
  maxSpawned: 6
  spawnInterval: 100
  maxLevel: 3
  minAltitude: 1
  spawnDistance: 40
  groupSizeMin: 2
  groupSizeMax: 5
  groupRadius: 8
