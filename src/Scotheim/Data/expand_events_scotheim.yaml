# Scotheim raids for Expand World Data (needs "Event data = true" in expand_world_data.cfg; EWD then merges
# this file with the vanilla raids in expand_events.yaml).
# Edit freely: Scotheim only replaces this file while it's unedited. Once edited, new defaults go to a .new file beside it.

# The Sluagh: the host of the restless dead, said to fly in from the west and take souls. Comes to bases in the
# Highlands at night, once Am Fear Liath Mòr has been killed.
- name: scotheim_sluagh
  duration: 120
  biome: highland_moor, caledonian_forest, munros
  requiredGlobalKeys: defeated_scot_greyman
  startMessage: The Sluagh are coming out of the west!
  endMessage: The host of the dead has passed on.
  forceEnvironment: Misty
  forceMusic: ''
  spawns:
  - prefab: Scot_Sluagh
    maxSpawned: 8
    spawnInterval: 6
    spawnChance: 100
    spawnAtDay: false
    maxLevel: 2
    spawnDistance: 40
    spawnRadiusMin: 30
    spawnRadiusMax: 50
    groupSizeMin: 2
    groupSizeMax: 3
    groupRadius: 4
    huntPlayer: true
    groundOffset: 6
    fields:
      damage: 2
