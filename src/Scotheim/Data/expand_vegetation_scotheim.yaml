# Scotheim's vegetation for the Highland biomes (Expand World Data 1.73 format).
# Scotheim writes this file only if it's missing, so edit freely; delete it to get the defaults back.
#
# Every entry starts from the matching vanilla entry (same prefab, tilt, altitude and grouping
# rules) and changes only the biome and the counts. Counts are per 64 m zone, like vanilla.
# Altitudes are metres above sea level. Ores and other materials are deliberately absent:
# those come with the materials pass.

# ------------------------------------------------------------------ Highland Moor
# Open heather moor: low shrubs, scattered birch copses, boulders, and the odd standing stone.

- prefab: Bush01_heath
  min: 30
  max: 50
  biome: highland_moor
  maxAltitude: 1000
  maxTerrainDelta: 2
- prefab: shrub_2_heath
  min: 20
  max: 30
  scaleMin: 0.5
  biome: highland_moor
  maxAltitude: 1000
  maxTerrainDelta: 2
# Birch copses where the forest noise is high, not a carpet of trees.
- prefab: Birch1
  min: 0
  max: 4
  scaleMin: 0.5
  randTilt: 4
  chanceToUseGroundTilt: 0.05
  biome: highland_moor
  minAltitude: 0.5
  maxAltitude: 60
  maxTilt: 30
  maxTerrainDelta: 2
  inForest: true
  forestTresholdMax: 0.9
- prefab: Birch2
  min: 0
  max: 2
  scaleMin: 0.5
  randTilt: 4
  chanceToUseGroundTilt: 0.05
