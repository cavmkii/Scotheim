  maxTilt: 15
  terrainDeltaRadius: 1
  maxTerrainDelta: 4
  groundOffset: -0.5
  groupSizeMin: 3
  groupSizeMax: 6
  groupRadius: 8
# Cloudberries grow on real Highland bogs.
- prefab: CloudberryBush
