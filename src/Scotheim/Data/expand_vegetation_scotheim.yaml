  minAltitude: 0.5
  maxAltitude: 60
  maxTilt: 30
  maxTerrainDelta: 2
  inForest: true
  forestTresholdMax: 0.9
# Glacial erratics and broken ground.
- prefab: Rock_3
  min: 1
  max: 6
  scaleMin: 2
  scaleMax: 4
  chanceToUseGroundTilt: 1
  biome: highland_moor
  minAltitude: -1000
  maxAltitude: 1000
  maxTerrainDelta: 2
  groundOffset: -0.5
- prefab: Rock_4
