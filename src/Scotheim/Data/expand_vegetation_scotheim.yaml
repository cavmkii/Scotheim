# Scotheim's vegetation for the Highland biomes (Expand World Data 1.73 format).
# Edit freely: Scotheim only replaces this file while it's unedited. Once edited, new defaults go to a .new file beside it.
#
# Every entry starts from the matching vanilla entry (same prefab, tilt, altitude and grouping
# rules) and changes only the biome and the counts. Counts are per 64 m zone, like vanilla.
# Altitudes are metres above sea level. Ores and other materials are deliberately absent:
# those come with the materials pass.

# ------------------------------------------------------------------ Highland Moor
# Open grazing moor: mostly flat and open, with sparse heath shrubs, a few birch copses,
# boulders and the odd standing stone.

- prefab: Bush01_heath
  min: 12
  max: 20
  biome: highland_moor
  maxAltitude: 1000
  maxTerrainDelta: 2
- prefab: shrub_2_heath
  min: 8
  max: 15
  scaleMin: 0.5
  biome: highland_moor
  maxAltitude: 1000
  maxTerrainDelta: 2
# The odd birch copse where the forest noise is high; the moor should read as open.
- prefab: Birch1
  min: 0
  max: 1
  scaleMin: 0.5
  randTilt: 4
  chanceToUseGroundTilt: 0.05
  biome: highland_moor
  minAltitude: 0.5
  maxAltitude: 60
  maxTilt: 30
  maxTerrainDelta: 2
  inForest: true
  forestTresholdMax: 0.9
- prefab: Birch2
  min: 0
  max: 0.5
