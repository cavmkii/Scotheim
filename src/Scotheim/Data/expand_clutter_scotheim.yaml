# ------------------------------------------------------------------ Munros
# Rough grass up the slopes, and shorter, patchier grass on the tops (montane heath, not bare rock).
- prefab: instanced_heathgrass
  amount: 80
  biome: munros
  instanced: true
  scaleMin: 0.7
  scaleMax: 1.2
  maxTilt: 40
  minAltitude: 0.5
  maxAltitude: 110
  terrainTilt: true
  fractalThresholdMax: 0.8
- prefab: instanced_heathgrass
  amount: 40
  biome: munros
  instanced: true
  scaleMin: 0.4
  scaleMax: 0.7
  maxTilt: 40
  minAltitude: 110
  maxAltitude: 1000
  terrainTilt: true
  fractalThresholdMax: 0.6
# Heather up the slopes, thinning towards the tops.
- prefab: Scot_Heather
  amount: 120
  biome: munros
  instanced: true
  maxTilt: 40
  minAltitude: 0.5
  maxAltitude: 130
  terrainTilt: true
  fractalScale: 4
  fractalThresholdMax: 0.8
- prefab: Scot_Heather
  amount: 40
