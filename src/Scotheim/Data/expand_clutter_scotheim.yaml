# Scotheim's ground clutter (grass, ferns, reeds) for the Highland biomes, Expand World Data 1.73 format.
# Edit freely: Scotheim only replaces this file while it's unedited. Once edited, new defaults go to a .new file beside it.
# Entries copy vanilla ones (see reference/ewd-1.73) with only the biome and amounts changed.

# ------------------------------------------------------------------ Highland Moor
# Meadow grass, with patches of heath flowers and bracken.
- prefab: instanced_meadows_grass
  amount: 200
  biome: highland_moor
  instanced: true
  scaleMax: 2.3
  maxTilt: 25
  minAltitude: 0.4
  maxAltitude: 1000
  terrainTilt: true
  fractalScale: 5
- prefab: instanced_meadows_grass_short
  amount: 250
  biome: highland_moor
  instanced: true
  scaleMax: 2
  maxTilt: 25
  minAltitude: 0.3
  maxAltitude: 1000
  terrainTilt: true
  fractalScale: 5
  fractalThresholdMin: 1
  fractalThresholdMax: 3
# Heather (Scot_Heather: the Plains heath flowers repainted purple in Content/Heather.cs). The moor is heather
# moorland, so it's everywhere here, thinning only in the wettest, lowest ground.
- prefab: Scot_Heather
  amount: 160
  biome: highland_moor
  instanced: true
  maxTilt: 35
  minAltitude: 0.5
  maxAltitude: 1000
  fractalScale: 4
  fractalThresholdMax: 0.8
- prefab: instanced_ormbunke
  amount: 12
  biome: highland_moor
  instanced: true
  maxTilt: 18
  minAltitude: 1
  maxAltitude: 1000
  terrainTilt: true
  fractalThresholdMin: 0.6

