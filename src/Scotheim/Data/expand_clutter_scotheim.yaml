  maxTilt: 40
  minAltitude: 130
  maxAltitude: 1000
  terrainTilt: true
  fractalScale: 4
  fractalThresholdMax: 0.6

# ------------------------------------------------------------------ Loch edges
- prefab: instanced_vass
  amount: 30
  biome: highland_moor, caledonian_forest, munros
  instanced: true
  scaleMax: 1.3
  maxTilt: 90
  minAltitude: -1
  maxAltitude: -0.1
  snapToWater: true
  fractalScale: 5
- prefab: instanced_waterlilies
  amount: 40
  biome: highland_moor, caledonian_forest
  instanced: true
  scaleMin: 0.4
  scaleMax: 0.6
  maxTilt: 90
  minAltitude: -1.5
  maxAltitude: -0.2
  snapToWater: true
  randomOffset: 0.1
  maxOceanDepth: 1
  fractalScale: 2
